<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共享单车互动调度模拟器</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; color: #333; }
.container { max-width: 1500px; margin: 0 auto; padding: 20px; }
.header { background: linear-gradient(90deg, #00b4db, #0083b0); color: white; padding: 20px 30px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; }
.header h1 { font-size: 24px; margin-bottom: 5px; }
.header p { opacity: 0.9; font-size: 13px; }

.main-layout { display: grid; grid-template-columns: 1fr 380px; gap: 20px; }
@media (max-width: 1100px) { .main-layout { grid-template-columns: 1fr; } }

.left-panel { display: flex; flex-direction: column; gap: 20px; }
.right-panel { display: flex; flex-direction: column; gap: 20px; }

.panel { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.panel h2 { color: #0083b0; margin-bottom: 15px; font-size: 20px; border-left: 4px solid #00b4db; padding-left: 12px; }
.panel h3 { color: #2a5298; margin: 15px 0 10px; font-size: 16px; }

.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; padding: 12px; background: #f8f9fa; border-radius: 10px; }
.controls label { font-weight: 600; font-size: 13px; }
.controls select, .controls input[type="number"], .controls input[type="text"] { padding: 8px 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; background: white; }
.controls button { padding: 8px 16px; border: none; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 13px; }
.controls button:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
.btn-primary { background: linear-gradient(90deg, #00b4db, #0083b0); }
.btn-success { background: linear-gradient(90deg, #4caf50, #388e3c); }
.btn-warning { background: linear-gradient(90deg, #ff9800, #f57c00); }
.btn-danger { background: linear-gradient(90deg, #f44336, #d32f2f); }

.map-container { position: relative; width: 100%; height: 550px; background: #f8f9fa; border-radius: 12px; overflow: hidden; border: 2px solid #e0e0e0; }
.map-container svg { width: 100%; height: 100%; }

.station circle { stroke: #333; stroke-width: 1.5; transition: all 0.3s; cursor: pointer; }
.station:hover circle { stroke-width: 3; filter: brightness(1.1); }
.station text { pointer-events: none; user-select: none; }
.station .inv-btn { cursor: pointer; }
.station .inv-btn:hover { filter: brightness(1.2); }

.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; padding: 10px; background: #f8f9fa; border-radius: 8px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 14px; height: 14px; border-radius: 3; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 10px 0; }
.stat-card { background: linear-gradient(135deg, #f8f9fa, #e9ecef); padding: 12px; border-radius: 10px; text-align: center; border-left: 4px solid #00b4db; }
.stat-card .value { font-size: 24px; font-weight: bold; color: #0083b0; }
.stat-card .label { font-size: 11px; color: #666; margin-top: 3px; }
.stat-card.danger { border-left-color: #f44336; }
.stat-card.danger .value { color: #f44336; }
.stat-card.warning { border-left-color: #ff9800; }
.stat-card.warning .value { color: #ff9800; }
.stat-card.success { border-left-color: #4caf50; }
.stat-card.success .value { color: #4caf50; }

.station-list { max-height: 450px; overflow-y: auto; }
.station-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; margin: 4px 0; background: #f8f9fa; transition: all 0.3s; }
.station-row.status-safe { background: #e8f5e9; border-left: 4px solid #4caf50; }
.station-row.status-low { background: #ffebee; border-left: 4px solid #f44336; }
.station-row.status-high { background: #fff3e0; border-left: 4px solid #ff9800; }
.station-row .s-id { font-weight: bold; width: 40px; font-size: 12px; }
.station-row .s-name { width: 70px; font-size: 11px; }
.station-row .s-type { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: #e0e0e0; }
.station-row .inv-section { display: flex; align-items: center; gap: 6px; flex: 1; }
.station-row .inv-bar { height: 10px; border-radius: 5px; background: #e0e0e0; flex: 1; max-width: 120px; overflow: hidden; }
.station-row .inv-fill { height: 100%; border-radius: 5px; transition: width 0.3s; }
.station-row .inv-fill.safe { background: linear-gradient(90deg, #4caf50, #81c784); }
.station-row .inv-fill.low { background: linear-gradient(90deg, #f44336, #e57373); }
.station-row .inv-fill.high { background: linear-gradient(90deg, #ff9800, #ffb74d); }
.station-row .inv-value { width: 35px; text-align: center; font-weight: bold; font-size: 13px; }
.station-row .inv-cap { color: #999; font-size: 11px; }
.station-row .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: 600; }
.station-row .status-badge.safe { background: #c8e6c9; color: #2e7d32; }
.station-row .status-badge.low { background: #ffcdd2; color: #c62828; }
.station-row .status-badge.high { background: #ffe0b2; color: #e65100; }
.station-row .adjust-section { display: flex; gap: 3px; }
.station-row .adjust-btn { width: 24px; height: 24px; border: 1px solid #ddd; background: white; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.station-row .adjust-btn:hover { background: #e3f2fd; }
.station-row .adjust-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.station-row .inv-input { width: 45px; padding: 3px; border: 1px solid #ddd; border-radius: 4px; text-align: center; font-weight: bold; font-size: 12px; }

.batch-input-area { padding: 15px; background: #e3f2fd; border-radius: 10px; margin: 10px 0; }
.batch-input-area label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; }
.batch-input-area input[type="text"] { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 13px; font-family: monospace; }
.batch-input-area .btn-row { display: flex; gap: 8px; margin-top: 10px; }
.batch-input-area button { flex: 1; padding: 8px; border: none; border-radius: 6px; color: white; font-weight: 600; cursor: pointer; }

.result-panel { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-radius: 12px; padding: 15px; margin: 10px 0; }
.result-panel.fail { background: linear-gradient(135deg, #ffebee, #ffcdd2); }
.result-panel.warn { background: linear-gradient(135deg, #fff3e0, #ffe0b2); }
.result-panel h4 { margin-bottom: 10px; }

table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #e0e0e0; }
th { background: linear-gradient(90deg, #00b4db, #0083b0); color: white; font-weight: 600; }
tr:hover { background: #f5f5f5; }

.progress-ring-container { display: flex; align-items: center; gap: 15px; }
.progress-ring { position: relative; width: 80px; height: 80px; }
.progress-ring svg { transform: rotate(-90deg); }
.progress-ring .center-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; font-size: 18px; }

.chart-container { position: relative; height: 280px; margin: 10px 0; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
.pulsing { animation: pulse 1.5s infinite; }

.station-detail-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.modal-content { background: white; border-radius: 15px; padding: 25px; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto; }
.modal-close { float: right; cursor: pointer; font-size: 24px; color: #999; border: none; background: none; }
.modal-close:hover { color: #333; }

.status-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
.status-indicator.safe { background: #4caf50; }
.status-indicator.low { background: #f44336; }
.status-indicator.high { background: #ff9800; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🚲 共享单车互动调度模拟器</h1>
    <p>手动调整各站点自行车数量，实时查看缺车/满桩状态，模拟早高峰调度效果</p>
  </div>

  <div class="controls">
    <button onclick="resetAll()" class="btn-warning">🔄 重置初始状态</button>
    <button onclick="applyAutoSched()" class="btn-success">⚡ 应用自动调度方案</button>
    <button onclick="runSimulation()" class="btn-primary">▶️ 运行模拟预测</button>
    <div style="margin-left:auto; display:flex; gap:10px; align-items:center;">
      <label>需求系数：</label>
      <input type="number" id="factorInput" value="1" min="0.5" max="1.5" step="0.1" style="width:70px;">
      <label>低阈值：</label>
      <input type="number" id="lowInput" value="0.2" min="0" max="0.5" step="0.05" style="width:60px;">
      <label>高阈值：</label>
      <input type="number" id="highInput" value="0.8" min="0.5" max="1" step="0.05" style="width:60px;">
    </div>
  </div>

  <div class="main-layout">
    <div class="left-panel">
      <div class="panel">
        <h2>🗺️ 互动调度地图</h2>
        <p style="color:#666; font-size:12px; margin-bottom:10px;">点击站点上的 <span style="color:#f44336; font-weight:bold;">-</span> 和 <span style="color:#4caf50; font-weight:bold;">+</span> 按钮调整库存，或点击站点查看详情</p>
        <div class="map-container" id="mainMap"></div>
        <div class="legend">
          <div class="legend-item"><div class="legend-color" style="background:#4caf50"></div>安全区间 (20%-80%)</div>
          <div class="legend-item"><div class="legend-color" style="background:#f44336"></div>缺车风险 (<20%)</div>
          <div class="legend-item"><div class="legend-color" style="background:#ff9800"></div>满桩风险 (>80%)</div>
          <div class="legend-item"><div class="legend-color" style="background:#00b4db"></div>调度中心</div>
        </div>
      </div>

      <div class="panel">
        <h2>📊 模拟预测结果</h2>
        <div id="resultArea">
          <p style="color:#666; text-align:center; padding:30px;">调整库存后点击"运行模拟预测"查看结果</p>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="panel">
        <h3>📈 实时统计</h3>
        <div class="stats" id="statsArea"></div>
      </div>

      <div class="panel">
        <h3>📝 批量输入</h3>
        <div class="batch-input-area">
          <label>快速设置各站点库存（用逗号分隔，共14个值）：</label>
          <input type="text" id="batchInput" placeholder="例如: 82,66,72,60,45,38,28,26,42,60,45,32,85,22">
          <div class="btn-row">
            <button onclick="applyBatch()" class="btn-primary">应用</button>
            <button onclick="document.getElementById('batchInput').value=''" class="btn-warning">清空</button>
          </div>
        </div>
      </div>

      <div class="panel" style="flex:1;">
        <h3>📋 站点库存控制</h3>
        <div class="station-list" id="stationList"></div>
      </div>
    </div>
  </div>
</div>

<script>
const stations = [
  {id:'S01', name:'东区宿舍A', type:'宿舍', x:0.6, y:0.8, cap:120, init:82},
  {id:'S02', name:'东区宿舍B', type:'宿舍', x:0.9, y:1.0, cap:100, init:66},
  {id:'S03', name:'西区宿舍', type:'宿舍', x:4.5, y:0.9, cap:110, init:72},
  {id:'S04', name:'南区宿舍', type:'宿舍', x:2.6, y:0.4, cap:90, init:60},
  {id:'S05', name:'第一教学楼', type:'教学', x:2.0, y:2.8, cap:140, init:45},
  {id:'S06', name:'第二教学楼', type:'教学', x:2.8, y:3.0, cap:120, init:38},
  {id:'S07', name:'理科实验楼', type:'实验', x:3.5, y:3.4, cap:90, init:28},
  {id:'S08', name:'工程训练中心', type:'实验', x:4.2, y:3.1, cap:80, init:26},
  {id:'S09', name:'图书馆', type:'图书馆', x:2.5, y:3.8, cap:100, init:42},
  {id:'S10', name:'第一食堂', type:'食堂', x:1.4, y:2.0, cap:120, init:60},
  {id:'S11', name:'第二食堂', type:'食堂', x:3.8, y:1.9, cap:90, init:45},
  {id:'S12', name:'体育场', type:'体育', x:1.0, y:4.2, cap:80, init:32},
  {id:'S13', name:'地铁校门', type:'交通', x:0.3, y:2.7, cap:130, init:85},
  {id:'S14', name:'行政服务中心', type:'行政', x:3.0, y:2.2, cap:60, init:22}
];

const dc = {x: 2.4, y: 2.5, name: '调度中心'};

const demandData = [
  {time: 390, S01:{b:1,r:0}, S02:{b:1,r:0}, S03:{b:2,r:0}, S04:{b:1,r:0}, S05:{b:0,r:2}, S06:{b:0,r:3}, S07:{b:0,r:2}, S08:{b:0,r:4}, S09:{b:0,r:0}, S10:{b:0,r:0}, S11:{b:0,r:0}, S12:{b:0,r:0}, S13:{b:3,r:0}, S14:{b:0,r:0}},
  {time: 420, S01:{b:5,r:0}, S02:{b:4,r:0}, S03:{b:4,r:0}, S04:{b:5,r:0}, S05:{b:0,r:8}, S06:{b:0,r:10}, S07:{b:0,r:6}, S08:{b:1,r:8}, S09:{b:0,r:1}, S10:{b:0,r:1}, S11:{b:0,r:0}, S12:{b:0,r:0}, S13:{b:5,r:1}, S14:{b:0,r:2}},
  {time: 450, S01:{b:9,r:1}, S02:{b:10,r:0}, S03:{b:9,r:0}, S04:{b:8,r:0}, S05:{b:0,r:20}, S06:{b:1,r:16}, S07:{b:1,r:10}, S08:{b:0,r:12}, S09:{b:1,r:4}, S10:{b:0,r:2}, S11:{b:0,r:1}, S12:{b:1,r:1}, S13:{b:12,r:1}, S14:{b:1,r:4}},
  {time: 480, S01:{b:9,r:1}, S02:{b:9,r:0}, S03:{b:9,r:1}, S04:{b:11,r:1}, S05:{b:1,r:20}, S06:{b:0,r:18}, S07:{b:0,r:12}, S08:{b:0,r:12}, S09:{b:0,r:4}, S10:{b:1,r:2}, S11:{b:1,r:1}, S12:{b:0,r:1}, S13:{b:12,r:0}, S14:{b:0,r:6}},
  {time: 510, S01:{b:7,r:0}, S02:{b:9,r:0}, S03:{b:9,r:1}, S04:{b:7,r:0}, S05:{b:0,r:16}, S06:{b:0,r:16}, S07:{b:1,r:8}, S08:{b:1,r:10}, S09:{b:0,r:2}, S10:{b:0,r:2}, S11:{b:0,r:2}, S12:{b:0,r:0}, S13:{b:10,r:0}, S14:{b:0,r:4}},
  {time: 540, S01:{b:4,r:0}, S02:{b:4,r:0}, S03:{b:4,r:0}, S04:{b:4,r:0}, S05:{b:0,r:8}, S06:{b:0,r:8}, S07:{b:0,r:6}, S08:{b:0,r:5}, S09:{b:0,r:1}, S10:{b:0,r:0}, S11:{b:0,r:1}, S12:{b:0,r:0}, S13:{b:6,r:0}, S14:{b:0,r:3}}
];

const timeLabels = ['06:30','07:00','07:30','08:00','08:30','09:00','09:30'];

let state = {
  inventory: {},
  lastSimulation: null
};

function getParams() {
  return {
    lowTarget: parseFloat(document.getElementById('lowInput').value) || 0.2,
    highTarget: parseFloat(document.getElementById('highInput').value) || 0.8,
    factor: parseFloat(document.getElementById('factorInput').value) || 1
  };
}

function getStation(id) { return stations.find(s => s.id === id); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function getStatus(inv, cap) {
  const ratio = inv / cap;
  const params = getParams();
  if (ratio < params.lowTarget) return { level: 'low', text: '缺车', color: '#f44336' };
  if (ratio > params.highTarget) return { level: 'high', text: '满桩', color: '#ff9800' };
  return { level: 'safe', text: '安全', color: '#4caf50' };
}

function initState() {
  stations.forEach(s => state.inventory[s.id] = s.init);
}

function renderMap() {
  const container = document.getElementById('mainMap');
  const width = container.clientWidth;
  const height = container.clientHeight;
  const padding = 40;
  const svgNS = "http://www.w3.org/2000/svg";
  
  let svg = container.querySelector('svg');
  if (svg) svg.remove();
  
  svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  const scaleX = (x) => padding + (x / 5) * (width - 2 * padding);
  const scaleY = (y) => height - padding - (y / 5) * (height - 2 * padding);

  for (let gx = 0; gx <= 5; gx++) {
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', scaleX(gx)); line.setAttribute('y1', scaleY(0));
    line.setAttribute('x2', scaleX(gx)); line.setAttribute('y2', scaleY(5));
    line.setAttribute('stroke', '#e8e8e8'); line.setAttribute('stroke-width', '1');
    svg.appendChild(line);
  }
  for (let gy = 0; gy <= 5; gy++) {
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', scaleX(0)); line.setAttribute('y1', scaleY(gy));
    line.setAttribute('x2', scaleX(5)); line.setAttribute('y2', scaleY(gy));
    line.setAttribute('stroke', '#e8e8e8'); line.setAttribute('stroke-width', '1');
    svg.appendChild(line);
  }

  const params = getParams();

  stations.forEach(s => {
    const g = document.createElementNS(svgNS, 'g');
    const invVal = state.inventory[s.id];
    const ratio = invVal / s.cap;
    const status = getStatus(invVal, s.cap);
    const baseR = 8 + Math.sqrt(s.cap) / 3;

    g.setAttribute('class', 'station');
    g.setAttribute('transform', `translate(${scaleX(s.x)}, ${scaleY(s.y)})`);

    const ring = document.createElementNS(svgNS, 'circle');
    ring.setAttribute('r', baseR + 5); ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', '#e0e0e0'); ring.setAttribute('stroke-width', '3');
    svg.appendChild(ring);

    const ringProgress = document.createElementNS(svgNS, 'circle');
    ringProgress.setAttribute('r', baseR + 5); ringProgress.setAttribute('fill', 'none');
    ringProgress.setAttribute('stroke', status.color); ringProgress.setAttribute('stroke-width', '3');
    const circumference = 2 * Math.PI * (baseR + 5);
    ringProgress.setAttribute('stroke-dasharray', `${circumference * Math.min(ratio, 1)}, ${circumference}`);
    ringProgress.setAttribute('stroke-dashoffset', circumference / 4);
    ringProgress.setAttribute('transform', 'rotate(-90)');
    ringProgress.style.transition = 'all 0.3s';
    svg.appendChild(ringProgress);

    const circle = document.createElementNS(svgNS, 'circle');
    circle.setAttribute('r', baseR);
    circle.setAttribute('fill', status.color);
    circle.setAttribute('stroke', '#333'); circle.setAttribute('stroke-width', '1.5');
    g.appendChild(circle);

    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('y', -(baseR + 14));
    label.setAttribute('text-anchor', 'middle'); label.setAttribute('font-weight', 'bold');
    label.setAttribute('font-size', '11px');
    label.textContent = s.id;
    g.appendChild(label);

    const invLabel = document.createElementNS(svgNS, 'text');
    invLabel.setAttribute('y', 4); invLabel.setAttribute('text-anchor', 'middle');
    invLabel.setAttribute('font-size', '11px'); invLabel.setAttribute('font-weight', 'bold');
    invLabel.setAttribute('fill', 'white');
    invLabel.textContent = invVal;
    g.appendChild(invLabel);

    const nameLabel = document.createElementNS(svgNS, 'text');
    nameLabel.setAttribute('y', baseR + 20); nameLabel.setAttribute('text-anchor', 'middle');
    nameLabel.setAttribute('font-size', '10px'); nameLabel.setAttribute('fill', '#666');
    nameLabel.textContent = s.name;
    g.appendChild(nameLabel);

    const statusLabel = document.createElementNS(svgNS, 'text');
    statusLabel.setAttribute('y', baseR + 32); statusLabel.setAttribute('text-anchor', 'middle');
    statusLabel.setAttribute('font-size', '9px'); statusLabel.setAttribute('font-weight', 'bold');
    statusLabel.setAttribute('fill', status.color);
    statusLabel.textContent = status.text;
    g.appendChild(statusLabel);

    const minusBtn = document.createElementNS(svgNS, 'g');
    minusBtn.setAttribute('class', 'inv-btn');
    minusBtn.setAttribute('transform', `translate(${-baseR - 14}, 0)`);
    const minusCircle = document.createElementNS(svgNS, 'circle');
    minusCircle.setAttribute('r', 9); minusCircle.setAttribute('fill', '#f44336');
    minusBtn.appendChild(minusCircle);
    const minusText = document.createElementNS(svgNS, 'text');
    minusText.setAttribute('text-anchor', 'middle'); minusText.setAttribute('y', 4);
    minusText.setAttribute('fill', 'white'); minusText.setAttribute('font-weight', 'bold');

function greedyScheduling() {
  const params = getParams();
  const inv = {};
  stations.forEach(s => inv[s.id] = state.inventory[s.id]);
  
  const finalInv = {};
  stations.forEach(s => {
    let curInv = inv[s.id];
    demandData.forEach(period => {
      const d = period[s.id];
      curInv += d.r * params.factor - d.b * params.factor;
    });
    finalInv[s.id] = curInv;
  });

  const needIn = {}, needOut = {};
  stations.forEach(s => {
    if (finalInv[s.id] < params.lowTarget * s.cap) {
      needIn[s.id] = params.lowTarget * s.cap - finalInv[s.id];
    } else if (finalInv[s.id] > params.highTarget * s.cap) {
      needOut[s.id] = finalInv[s.id] - params.highTarget * s.cap;
    }
  });

  const moves = {};
  const remainingIn = {...needIn};
  const remainingOut = {...needOut};
  const flow = {};
  stations.forEach(s => flow[s.id] = 0);

  for (const target of Object.keys(remainingOut).sort((a,b) => remainingOut[b] - remainingOut[a])) {
    let remain = remainingOut[target];
    const candidates = Object.keys(remainingIn).filter(s => remainingIn[s] > 0)
      .sort((a,b) => dist(getStation(a), getStation(b)) - dist(getStation(b), getStation(a)));
    for (const src of candidates) {
      if (remain <= 0) break;
      const avail = remainingIn[src];
      const qty = Math.floor(Math.min(remain, avail, 18));
      if (qty > 0) {
        moves[`${src}->${target}`] = qty;
        flow[src] -= qty;
        flow[target] += qty;
        remainingIn[src] -= qty;
        remainingOut[target] -= qty;
        remain -= qty;
      }
    }
  }

  for (let iter = 0; iter < 3; iter++) {
    const curInv = computeFinalInv(flow);
    stations.forEach(s => {
      const fInv = curInv[s.id];
      if (fInv < params.lowTarget * s.cap) {
        const need = Math.ceil(params.lowTarget * s.cap - fInv + 0.01);
        for (const src of stations.sort((a,b) => dist(a,s) - dist(b,s))) {
          if (need <= 0) break;
          const srcFinal = curInv[src.id];
          const avail = srcFinal - params.highTarget * src.cap;
          if (avail > 0.5) {
            const qty = Math.min(need, Math.floor(avail));
            if (qty > 0) {
              const key = `${src.id}->${s.id}`;
              moves[key] = (moves[key] || 0) + qty;
              flow[src.id] -= qty;
              flow[s.id] += qty;
              need -= qty;
            }
          }
        }
      } else if (fInv > params.highTarget * s.cap) {
        const need = Math.ceil(fInv - params.highTarget * s.cap + 0.01);
        for (const tgt of stations.sort((a,b) => dist(s,a) - dist(s,b))) {
          if (need <= 0) break;
          const tgtFinal = curInv[tgt.id];
          const gap = params.highTarget * tgt.cap - tgtFinal;
          if (gap > 0.5) {
            const qty = Math.min(need, Math.ceil(gap));
            if (qty > 0) {
              const key = `${s.id}->${tgt.id}`;
              moves[key] = (moves[key] || 0) + qty;
              flow[s.id] -= qty;
              flow[tgt.id] += qty;
              need -= qty;
            }
          }
        }
      }
    });
  }

  return {moves, flow};
}

function computeFinalInv(flow) {
  const params = getParams();
  const inv = {};
  stations.forEach(s => inv[s.id] = state.inventory[s.id] + (flow[s.id] || 0));
  demandData.forEach(period => {
    stations.forEach(s => {
      const d = period[s.id];
      inv[s.id] += d.r * params.factor - d.b * params.factor;
    });
  });
  return inv;
}

function minCostFlowScheduling() {
  const params = getParams();
  
  // 1. 计算无调度下的 09:30 库存
  const finalInv = {};
  stations.forEach(s => {
    let curInv = state.inventory[s.id];
    demandData.forEach(period => {
      const d = period[s.id];
      curInv += d.r * params.factor - d.b * params.factor;
    });
    finalInv[s.id] = curInv;
  });

  // 2. 构建供给/需求节点
  // 供给：溢出站（库存 > 80%容量）
  // 需求：有剩余容量的站（库存 < 80%容量）
  const supply = {}; // 站点 -> 可调出量
  const demand = {}; // 站点 -> 可调入量（剩余容量）
  
  stations.forEach(s => {
    const inv = finalInv[s.id];
    const cap = s.cap;
    const highT = params.highTarget * cap;
    
    if (inv > highT) {
      supply[s.id] = inv - highT; // 溢出量
    } else if (inv < highT) {
      demand[s.id] = highT - inv; // 剩余容量
    }
  });

  const supplyNodes = Object.keys(supply);
  const demandNodes = Object.keys(demand);
  
  if (supplyNodes.length === 0 || demandNodes.length === 0) {
    return {moves: {}, flow: {}, totalCost: 0};
  }

  // 3. 最小费用流：成功最短增广路算法
  const nS = supplyNodes.length;
  const nD = demandNodes.length;
  const N = nS + nD + 2;
  const SRC = nS + nD;
  const SNK = nS + nD + 1;

  const adj = Array.from({length: N}, () => []);
  
  function addEdge(u, v, cap, cost) {
    adj[u].push([v, cap, cost, adj[v].length]);
    adj[v].push([u, 0, -cost, adj[u].length - 1]);
  }

  // 源点到供给节点
  supplyNodes.forEach((s, i) => addEdge(SRC, i, supply[s], 0));
  // 需求节点到汇点
  demandNodes.forEach((d, j) => addEdge(nS + j, SNK, demand[d], 0));
  // 供给到需求
  supplyNodes.forEach((s, i) => {
    demandNodes.forEach((d, j) => {
      const sInfo = getStation(s);
      const dInfo = getStation(d);
      addEdge(i, nS + j, 18, dist(sInfo, dInfo)); // 单车容量上限18
    });
  });

  // SPFA 最短增广路
  let totalFlow = 0;
  let totalCost = 0;
  const maxFlow = Object.values(supply).reduce((a, b) => a + b, 0);

  while (totalFlow < maxFlow) {
    const distArr = Array(N).fill(Infinity);
    const inQueue = Array(N).fill(false);
    const prevV = Array(N).fill(-1);
    const prevE = Array(N).fill(-1);
    
    distArr[SRC] = 0;
    const q = [SRC];
    inQueue[SRC] = true;
    
    while (q.length > 0) {
      const u = q.shift();
      inQueue[u] = false;
      
      for (let ei = 0; ei < adj[u].length; ei++) {
        const [v, cap, cost, rev] = adj[u][ei];
        if (cap > 0 && distArr[v] > distArr[u] + cost) {
          distArr[v] = distArr[u] + cost;
          prevV[v] = u;
          prevE[v] = ei;
          if (!inQueue[v]) {
            q.push(v);
            inQueue[v] = true;
          }
        }
      }
    }
    
    if (distArr[SNK] === Infinity) break;
    
    // 增广
    let f = Infinity;
    for (let v = SNK; v !== SRC; v = prevV[v]) {
      const u = prevV[v];
      const ei = prevE[v];
      f = Math.min(f, adj[u][ei][1]);
    }
    
    for (let v = SNK; v !== SRC; v = prevV[v]) {
      const u = prevV[v];
      const ei = prevE[v];
      adj[u][ei][1] -= f;
      const rev = adj[u][ei][3];
      adj[v][rev][1] += f;
      totalCost += f * adj[u][ei][2];
    }
    totalFlow += f;
  }

  // 4. 提取搬运方案
  const moves = {};
  const flow = {};
  stations.forEach(s => flow[s.id] = 0);
  
  supplyNodes.forEach((s, i) => {
    for (const [v, cap, cost, rev] of adj[i]) {
      if (v >= nS && v < nS + nD) {
        const d = demandNodes[v - nS];
        const used = adj[v][rev][1]; // 反向边容量 = 已用流量
        if (used > 0) {
          moves[`${s}->${d}`] = used;
          flow[s] = (flow[s] || 0) - used;
          flow[d] = (flow[d] || 0) + used;
        }
      }
    }
  });

  return {moves, flow, totalCost: totalCost.toFixed(2)};
}

function showSchedulingAnimation(moves, totalCost) {

  `;
  
  const movesList = Object.entries(moves).map(([k, v]) => `${k}: ${v}辆`).join('\n');
  overlay.innerHTML = `
    <div style="text-align: center; max-width: 500px; padding: 30px;">
      <h2 style="color: #00b4db; margin-bottom: 10px;">🚚 调度方案动画演示</h2>
      <div style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; margin: 20px 0; font-size: 14px; line-height: 1.8; white-space: pre-wrap;">${movesList}</div>
      <div style="font-size: 24px; font-weight: bold; color: #4caf50; margin: 20px 0;">
        总静态运输量: <span id="animCost">0.00</span> 车·km
      </div>
      <button id="skipAnim" style="padding: 12px 30px; background: linear-gradient(90deg, #00b4db, #0083b0); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">跳过动画</button>
    </div>
  `;
  document.body.appendChild(overlay);
  
  // 数字滚动动画
  const costEl = document.getElementById('animCost');
  let current = 0;
  const target = totalCost;
  const duration = 1500;
  const startTime = Date.now();
  
  function animate() {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    costEl.textContent = (target * eased).toFixed(2);
    if (progress < 1) requestAnimationFrame(animate);
  }
  animate();
  
  // 点击跳过
  document.getElementById('skipAnim').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  
  // 3秒后自动关闭
  setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 4000);
}

function applyAutoSched() {
  const result = minCostFlowScheduling();
  
  // 显示调度动画
  showSchedulingAnimation(result.moves, result.totalCost);
  
  // 应用调度结果
  stations.forEach(s => {
    state.inventory[s.id] = Math.max(0, Math.min(s.cap, Math.round(state.inventory[s.id] + (result.flow[s.id] || 0))));
  });
  updateAll();
  runSimulation();
}

function runSimulation() {
  const params = getParams();
  const inv = {};
  stations.forEach(s => inv[s.id] = [state.inventory[s.id]]);
  demandData.forEach(period => {
    stations.forEach(s => {
      const d = period[s.id];
      inv[s.id].push(inv[s.id][inv[s.id].length-1] + d.r * params.factor - d.b * params.factor);
    });
  });

  let servedCount = 0;
  const failedStations = [];
  const stationResults = [];
  
  stations.forEach(s => {
    const finalInv = inv[s.id][inv[s.id].length-1];
    const lowT = params.lowTarget * s.cap;
    const highT = params.highTarget * s.cap;
    const meetsGoal = finalInv >= lowT && finalInv <= highT;
    if (meetsGoal) servedCount++;
    else failedStations.push({...s, finalInv, lowT, highT});
    
    const status = getStatus(finalInv, s.cap);
    stationResults.push({
      id: s.id,
      name: s.name,
      type: s.type,
      initInv: state.inventory[s.id],
      finalInv: finalInv,
      status: status,
      meetsGoal: meetsGoal,
      predictions: inv[s.id]
    });
  });

  state.lastSimulation = { inv, stationResults, servedCount, failedStations };

  const rate = Math.round(servedCount / stations.length * 100);
  const panelClass = servedCount === stations.length ? '' : servedCount >= stations.length * 0.7 ? 'warn' : 'fail';
  const rateColor = servedCount === stations.length ? '#4caf50' : servedCount >= stations.length * 0.7 ? '#ff9800' : '#f44336';

  let html = `
    <div class="result-panel ${panelClass}">
      <h4>📊 模拟预测结果（需求系数 ${params.factor}x）</h4>

        <div class="progress-ring">
          <svg width="80" height="80">
            <circle cx="40" cy="40" r="32" fill="none" stroke="#e0e0e0" stroke-width="8"/>
            <circle cx="40" cy="40" r="32" fill="none" 
              stroke="${rateColor}" 
              stroke-width="8" 
              stroke-dasharray="${2*Math.PI*32*rate/100}, ${2*Math.PI*32}"
              stroke-dashoffset="${2*Math.PI*32/4}"
              stroke-linecap="round"/>
          </svg>
          <div class="center-text" style="color:${rateColor}">${rate}%</div>
        </div>
        <div>
          <p><strong>达标站点：</strong>${servedCount} / ${stations.length}</p>
          <p><strong>未达标：</strong>${failedStations.length} 个站点</p>
          <p><strong>评价：</strong>${servedCount===stations.length?'🎉 全部达标！':servedCount>=stations.length*0.7?'⚠️ 部分达标':'❌ 多数站点未达标'}</p>
        </div>
      </div>
    </div>
  `;

  const lowRisk = stationResults.filter(s => s.status.level === 'low').length;
  const highRisk = stationResults.filter(s => s.status.level === 'high').length;
  
  html += `
    <div class="stats">
      <div class="stat-card success"><div class="value">${servedCount}</div><div class="label">达标站点</div></div>
      <div class="stat-card danger"><div class="value">${lowRisk}</div><div class="label">缺车站点</div></div>
      <div class="stat-card warning"><div class="value">${highRisk}</div><div class="label">满桩站点</div></div>
      <div class="stat-card"><div class="value">${params.factor}x</div><div class="label">需求系数</div></div>
    </div>
  `;

  if (failedStations.length > 0) {
    html += '<h3>⚠️ 未达标站点详情</h3>';
    html += '<div style="overflow-x:auto;"><table>';
    html += '<tr><th>站点</th><th>名称</th><th>初始库存</th><th>09:30库存</th><th>安全区间</th><th>状态</th><th>偏差</th></tr>';
    failedStations.forEach(s => {
      const deviation = s.finalInv < s.lowT ? `缺 ${Math.ceil(s.lowT - s.finalInv)}` : `余 ${Math.ceil(s.finalInv - s.highT)}`;
      const statusBadge = s.finalInv < s.lowT ? '<span class="status-badge low">缺车</span>' : '<span class="status-badge high">满桩</span>';
      html += `<tr>
        <td>${s.id}</td><td>${s.name}</td>
        <td>${state.inventory[s.id]}</td>
        <td style="color:${s.finalInv < s.lowT ? '#f44336' : '#ff9800'};font-weight:bold">${Math.round(s.finalInv)}</td>
        <td>[${s.lowT.toFixed(0)}, ${s.highT.toFixed(0)}]</td>
        <td>${statusBadge}</td>
        <td style="color:${s.finalInv < s.lowT ? '#f44336' : '#ff9800'}">${deviation}</td>
      </tr>`;
    });
    html += '</table></div>';
  }

  html += '<h3>📈 各站点库存演化预测</h3>';
  html += '<div class="chart-container"><canvas id="predictionChart"></canvas></div>';

  document.getElementById('resultArea').innerHTML = html;

  setTimeout(() => {
    const ctx = document.getElementById('predictionChart');
    if (ctx) {

      new Chart(ctx, {

            label: `${s.id} ${s.name}`,
            data: s.predictions.map(Math.round),
            borderColor: colors[i % colors.length],
            backgroundColor: colors[i % colors.length] + '20',
            borderWidth: 1.5,
            tension: 0.3,
            pointRadius: 3,
            pointHoverRadius: 6
          }))
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'nearest', intersect: false },
          plugins: {
            legend: { position: 'bottom', labels: { font: { size: 10 }, boxWidth: 12, padding: 8 } },
            title: { display: true, text: '各站点库存变化预测（06:30 - 09:30）' }
          },
          scales: {
            y: { beginAtZero: true, title: { display: true, text: '库存(辆)' } },
            x: { title: { display: true, text: '时间' } }
          }
        }
      });
    }
  }, 100);
}

function showStationDetail(s) {
  const params = getParams();
  const invVal = state.inventory[s.id];
  const ratio = invVal / s.cap;
  const status = getStatus(invVal, s.cap);
  const lowT = params.lowTarget * s.cap;
  const highT = params.highTarget * s.cap;
  
  const invArr = [invVal];
  demandData.forEach(period => {
    const d = period[s.id];
    invArr.push(invArr[invArr.length-1] + d.r * params.factor - d.b * params.factor);
  });

  const netBorrow = demandData.reduce((sum, p) => sum + (p[s.id]?.b || 0), 0);
  const netReturn = demandData.reduce((sum, p) => sum + (p[s.id]?.r || 0), 0);

  const modal = document.createElement('div');
  modal.className = 'station-detail-modal';
  modal.innerHTML = `
    <div class="modal-content">
      <button class="modal-close" onclick="this.closest('.station-detail-modal').remove()">&times;</button>
      <h3>${s.id} - ${s.name} <span class="status-badge ${status.level}">${status.text}</span></h3>
      <div style="background:${status.level==='low'?'#ffebee':status.level==='high'?'#fff3e0':'#e8f5e9'};padding:20px;border-radius:10px;margin:15px 0;text-align:center;">
        <div style="font-size:42px;font-weight:bold;color:${status.color}">${Math.round(invVal)}</div>
        <div style="color:#666;font-size:14px">当前库存 / ${s.cap} 辆 (${(ratio*100).toFixed(1)}%)</div>
        <div style="color:#999;font-size:12px;margin-top:5px;">安全区间: [${lowT.toFixed(0)}, ${highT.toFixed(0)}]</div>
      </div>
      
      <div style="display:flex;gap:8px;margin:15px 0;">
        <button onclick="adjustInv('${s.id}', -10); this.closest('.station-detail-modal').remove()" style="flex:1;padding:12px;background:#f44336;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">-10</button>
        <button onclick="adjustInv('${s.id}', -1); this.closest('.station-detail-modal').remove()" style="flex:1;padding:12px;background:#ff9800;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">-1</button>
        <button onclick="adjustInv('${s.id}', 1); this.closest('.station-detail-modal').remove()" style="flex:1;padding:12px;background:#4caf50;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">+1</button>
        <button onclick="adjustInv('${s.id}', 10); this.closest('.station-detail-modal').remove()" style="flex:1;padding:12px;background:#0083b0;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">+10</button>
      </div>

      <div style="background:#f8f9fa;padding:15px;border-radius:10px;margin:10px 0;">
        <p><strong>类型：</strong>${s.type}</p>
        <p><strong>坐标：</strong>(${s.x}, ${s.y}) km</p>
        <p><strong>容量：</strong>${s.cap} 辆</p>
        <p><strong>早高峰借车：</strong>${netBorrow} 辆</p>
        <p><strong>早高峰还车：</strong>${netReturn} 辆</p>
        <p><strong>净流量：</strong>${netReturn - netBorrow} 辆 ${netReturn - netBorrow < 0 ? '(流出)' : '(流入)'}</p>
        <p><strong>09:30预测：</strong>${invArr[invArr.length-1].toFixed(1)} 辆</p>
      </div>

      <h4 style="margin:15px 0;">📉 库存演化预测</h4>
      <div class="chart-container"><canvas id="detailChart"></canvas></div>
      
      <button onclick="this.closest('.station-detail-modal').remove()" style="width:100%;padding:12px;background:linear-gradient(90deg,#00b4db,#0083b0);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:10px;">关闭</button>
    </div>
  `;
  document.body.appendChild(modal);

  setTimeout(() => {
    const ctx = document.getElementById('detailChart');
    if (ctx) {
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: timeLabels,
          datasets: [
            {
              label: '库存预测',
              data: invArr.map(Math.round),
              borderColor: status.color,
              backgroundColor: status.color + '30',
              fill: true,
              tension: 0.3,
              pointRadius: 5,
              pointBackgroundColor: status.color
            },
            {
              label: '安全下限',
              data: timeLabels.map(() => Math.round(lowT)),
              borderColor: '#f44336',
              borderDash: [5, 5],
              borderWidth: 1,
              pointRadius: 0,
              fill: false
            },
            {
              label: '安全上限',
              data: timeLabels.map(() => Math.round(highT)),
              borderColor: '#ff9800',
              borderDash: [5, 5],
              borderWidth: 1,
              pointRadius: 0,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' } },
          scales: {
            y: { beginAtZero: true, title: { display: true, text: '库存(辆)' } },
            x: { title: { display: true, text: '时间' } }
          }
        }
      });
    }
  }, 100);
}

document.getElementById('factorInput').addEventListener('change', () => {
  if (state.lastSimulation) runSimulation();
});
document.getElementById('lowInput').addEventListener('change', () => {
  renderMap();
  renderStationList();
  renderStats();
  if (state.lastSimulation) runSimulation();
});
document.getElementById('highInput').addEventListener('change', () => {
  renderMap();
  renderStationList();
  renderStats();
  if (state.lastSimulation) runSimulation();
});

window.addEventListener('DOMContentLoaded', () => {
  initState();
  updateAll();
});

window.addEventListener('resize', () => {
  renderMap();
});
</script>
</body>
</html>
